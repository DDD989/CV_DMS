<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Portafolio Colaborativo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="home">
    <header>
        <h1>Portafolio Colaborativo</h1>
        <p>Tecnologías Computacionales I</p>
    </header>

    <main class="container">

        <section class="controls">
            <label for="sort">Ordenar por:</label>
            <select id="sort">
                <option value="az">Nombre (A-Z)</option>
                <option value="za">Nombre (Z-A)</option>
            </select>
        </section>

        <section class="members">
            <h2>Integrantes</h2>
            <div class="grid" id="cards-container">

                <div class="card-index" data-name="Diego Miguel Segundo">
                    <a href="cv/dms/">
                        <img src="img/dms.jpeg" alt="Diego Miguel Segundo">
                        <h3>Diego Miguel Segundo</h3>
                    </a>
                </div>

                <div class="card-index" data-name="Diana Ivon Benitez Gonzalez">
                    <a href="cv/dibg/">
                        <img src="img/dibg.jpeg" alt="Diana Ivon Benitez Gonzalez">
                        <h3>Diana Ivon Benitez Gonzalez</h3>
                    </a>
                </div>

                <div class="card-index" data-name="Jessica Mijal Lopez De Jesus">
                    <a href="cv/Mijal/">
                        <img src="img/Mijal.jpeg" alt="Jessica Mijal Lopez De Jesus">
                        <h3>Jessica Mijal Lopez De Jesus</h3>
                    </a>
                </div>

            </div>
        </section>

    </main>

    <footer>
        <p>Universidad Autónoma del Estado de México</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
